[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "open-raster-timing-marker"
version = "0.1.0"
description = "Reference codec and raster decoder for Open Raster Timing Marker"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"

[project.optional-dependencies]
image = ["Pillow>=10"]

[tool.setuptools.packages.find]
where = ["src/python"]
